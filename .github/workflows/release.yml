name: release

on:
  push:
    branches:
    - 'main'

jobs:
  release:
    runs-on: ubuntu-22.04
      # TODO: Should run pull request job before!
    # needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: go-semantic-release/action@v1
        with:
          # TODO: Switch dry off as soon as we release the first version!
          dry: true
          changelog-file: CHANGELOG.md
          prepend: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
